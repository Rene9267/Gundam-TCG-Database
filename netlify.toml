[build]
  publish = "."
  command = "npx tailwindcss -i ./src/tailwind.css -o ./dist/tailwind.css"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # Security headers
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https://pub-f106953afafa4b379122130a0f038335.r2.dev; connect-src 'self' https://zhrvhhzcsdadoolxqpro.supabase.co; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, immutable"

[[headers]]
  for = "*.{js,css}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
